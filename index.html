<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rail Rush 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* ======================= [CSS] STYLES ======================= */
  :root{--f:"Lilita One","Arial Rounded MT Bold",Impact,"Arial Black",sans-serif;--navy:#0b2f6b;--yel:#ffd426;--green:#3ddc4a}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#06122b;font-family:var(--f);color:#fff;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #wrap{position:fixed;left:50%;top:0;transform:translateX(-50%);box-shadow:0 0 0 2px #12306b,0 0 60px rgba(0,0,0,.6);background:#8ad1ff;overflow:hidden}
  #wrap>canvas{width:100%;height:100%;display:block}
  .hidden{display:none!important}
  .t{color:#fff;-webkit-text-stroke:3px var(--navy);paint-order:stroke fill;text-shadow:0 4px 0 var(--navy);letter-spacing:1px}

  .screen>*{pointer-events:auto}
  .screen.solid{justify-content:center;gap:16px;pointer-events:auto;background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.55),transparent 45%),repeating-conic-gradient(from 0deg at 50% 22%,rgba(255,255,255,.14) 0 8deg,transparent 8deg 16deg),linear-gradient(180deg,#3fc0ff,#1f86e6 55%,#0f4fb5)}
  .logo{font-size:64px;line-height:.92;text-align:center;transform:rotate(-4deg);color:var(--yel);-webkit-text-stroke:4px var(--navy);paint-order:stroke fill;text-shadow:0 6px 0 var(--navy),0 10px 0 rgba(0,0,0,.25);animation:bob 2.4s ease-in-out infinite}
  .logo span{color:#fff}
  @keyframes bob{50%{transform:rotate(-4deg) translateY(-6px)}}

  #menu{justify-content:flex-start;gap:4px}
  #menu .logo{font-size:46px;line-height:1;margin-top:6px;-webkit-text-stroke:3px var(--navy)}
  #menu .bottom{margin-top:auto;gap:6px}
  .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%}
  .chip{display:flex;align-items:center;gap:8px;padding:5px 16px;border-radius:30px;font-size:21px;background:linear-gradient(180deg,#2a8cf0,#1456c2);border:3px solid #fff;box-shadow:0 4px 0 var(--navy),inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 var(--navy)}
  .coin{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b8,#ffd426 50%,#d68e00);box-shadow:0 0 0 2px #8a5a00,0 0 10px rgba(255,212,38,.8);animation:spin 1.4s linear infinite}

  .round.blue{background:linear-gradient(180deg,#38a6ff,#1456c2);box-shadow:0 5px 0 #0b2f6b,inset 0 2px 0 rgba(255,255,255,.5)}
  button{font-family:var(--f);cursor:pointer;border:none}
  button:active{transform:translateY(4px)}

  .link{background:none;color:#fff;font-size:14px;text-decoration:underline;opacity:.85;text-shadow:0 2px 0 rgba(0,0,0,.6)}

  .picker{display:flex;align-items:center;gap:10px}

  .plate{min-width:160px;padding:4px 18px 6px;border-radius:16px;font-size:28px;text-align:center;background:linear-gradient(180deg,#ffe85a,#ffb300);border:4px solid #fff;box-shadow:0 5px 0 #b86400;color:#fff;-webkit-text-stroke:2px #a85a00;paint-order:stroke fill;text-shadow:0 3px 0 #a85a00}
  .desc{font-size:14px;text-shadow:0 2px 0 rgba(0,0,0,.65);text-align:center}
  .dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5);border:2px solid #fff}.dots i.on{background:var(--yel)}
  input[type=tel]{-webkit-user-select:text;user-select:text;padding:14px;font-size:22px;font-family:var(--f);border-radius:40px;border:5px solid #fff;width:260px;text-align:center;background:#fff;color:var(--navy);box-shadow:0 6px 0 var(--navy),inset 0 3px 6px rgba(0,0,0,.15)}
  input[type=tel]:focus{outline:none;box-shadow:0 0 0 5px rgba(61,220,74,.6),0 6px 0 var(--navy)}

  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  label.s{display:block;text-align:left;font-size:18px;margin-top:8px;text-shadow:0 2px 0 var(--navy)}
  label.s b{float:right;color:var(--yel)}
  input[type=range]{width:100%;height:34px;accent-color:#ffd426}
  .pre{font-size:16px;padding:6px 14px 8px;border-radius:20px;color:var(--navy);background:linear-gradient(180deg,#fff,#cfe6ff);box-shadow:0 4px 0 #6a8fc4}

  #go.on{animation:go .9s ease-out}
  @keyframes go{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.2)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
  .fb{font-size:11px;opacity:.85;text-align:center;text-shadow:0 1px 0 #000;max-width:280px}
</style>

    <label class="s" style="display:flex;justify-content:space-between;align-items:center">Sound <input type="checkbox" id="snd" checked style="width:28px;height:28px;accent-color:#ffd426"></label>

</div>

    }
  /* ===================== [SECTION 12] CAMERA + SIZING + BOOT ===================== */
let autoZ = 12; const camPos = new THREE.Vector3(.5, 1.55, 6.6), camLook = new THREE.Vector3(0, .15, 0);
function fit() { const h = innerHeight, w = Math.min(innerWidth, h * 0.62); wrap.style.width = w + "px"; wrap.style.height = h + "px"; renderer.setSize(w, h); camera.aspect = w / h;
